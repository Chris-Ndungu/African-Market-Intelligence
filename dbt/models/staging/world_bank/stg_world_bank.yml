version: 2

models:
  - name: stg_world_bank__indicators
    description: "Staging view for cleaned and deduplicated World Bank macroeconomic indicators."
    columns: 
      - name: record_id
        description: "Unique ingested record ID."
        tests:
          - not_null
          - unique

      - name: indicator_key
        tests:
          - not_null

      - name: country_code
        tests:
          - not_null

      - name: indicator_code
        tests:
          - not_null

      - name: report_year
        tests:
          - not_null
