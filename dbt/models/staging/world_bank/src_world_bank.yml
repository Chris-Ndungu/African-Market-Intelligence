version: 2

sources:
  - name: world_bank_raw
    database: "{{ env_var('GCP_PROJECT') }}"
    schema: "{{ env_var('BQ_RAW_DATASET', 'raw_african_macro') }}"
    tables: 
      - name: raw_world_bank
        description: "Raw macroeconomic indicators loaded from ingestion scripts."
        config: 
          loaded_at_field: loaded_at 
          freshness:
            warn_after: {count: 25, period: hour}
            error_after: {count: 48, period: hour}
        columns: 
          - name: record_id
            tests:
              - not_null

          - name: country_code
            tests:
              - not_null

          - name: indicator_key
            tests:
              - not_null
          
          - name: indicator_code
            tests:
              - not_null
          
          - name: year
            tests:
              - not_null
