version: 2

sources:
  - name: world_bank_raw
    database: "{{ env_var('GCP_PROJECT') }}"
    schema: raw_african_macro
    tables: 
      - name: raw_world_bank
        description: "Raw macroeconomic indicators loaded from ingestion scripts."
        config: 
          loaded_at_field: loaded_at 
        columns: 
          - name: record_id
            tests:
              - not_null
              - unique

          - name: country_code
            tests:
              - not_null

          - name: indicator_key
            tests:
              - not_null
          
          - name: indicator_code
            tests:
              - not_null
          
          - name: year
            tests:
              - not_null
