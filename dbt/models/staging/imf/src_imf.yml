version: 2

sources:
  - name: imf_raw
    description: "Raw IMF DataMapper economic indicator records ingested via Python."
    database: "{{ env_var('GCP_PROJECT') }}"
    schema: raw_african_macro

    tables: 
      - name: raw_imf
        description: "Raw macroeconomic indicators loaded from ingestion scripts."
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 180, period: day}
            error_after: {count: 365, period: day}

        columns:
          - name: record_id
            description: "Surrogate key generated during raw ingestion."
          - name: country_code
            description: "ISO3 3-letter country identifier in raw payload."
          - name: indicator_code
            description: "IMF DataMapper metric code (e.g., NGDP_RPCH)."
          - name: indicator_name
            description: "Human-readable indicator description."
          - name: category
            description: "Macroeconomic theme or bucket."
          - name: year
            description: "Reporting calendar year."
          - name: value
            description: "Raw indicator numeric value."
          - name: unit
            description: "Unit of measurement in raw payload."
          - name: is_forecast
            description: "Boolean flag for estimated or projected figures."
          - name: source
            description: "Source API identifier."
          - name: loaded_at
            description: "BigQuery ingestion timestamp."
          - name: ingestion_date
            description: "Partitioning date."