name: Publish dbt docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let an in-flight Pages deployment finish rather than cancelling it midway.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: docs-project
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dbt-core>=1.8,<2.0" "dbt-bigquery>=1.8,<2.0"

      - name: Configure credential-free dbt profile
        run: |
          mkdir -p "$RUNNER_TEMP/dbt-profiles"
          cat > "$RUNNER_TEMP/dbt-profiles/profiles.yml" <<'YAML'
          african_market_intelligence:
            target: docs
            outputs:
              docs:
                type: bigquery
                method: oauth
                project: docs-project
                dataset: docs_catalog
                threads: 1
                location: US
          YAML

      - name: Install dbt packages
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: ${{ runner.temp }}/dbt-profiles
        run: dbt deps

      # Compiling opens a BigQuery connection, which fails without credentials.
      # Parse (credential-free, as in CI) and build the docs from that manifest.
      - name: Generate dbt docs
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: ${{ runner.temp }}/dbt-profiles
        run: |
          dbt parse --target docs
          dbt docs generate --no-compile --empty-catalog --target docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dbt/target

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
